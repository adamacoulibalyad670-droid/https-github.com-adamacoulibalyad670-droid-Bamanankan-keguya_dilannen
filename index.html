<!DOCTYPE html>
<html lang="bm" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url='./bambara_ai_studio_fixed.html'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bamanankan AI Studio</title>
  <style>
    :root {
      --bg: #020817;
      --panel: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #fbbf24;
      --line: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, rgba(251,191,36,0.12), transparent 26%), var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(560px, 92vw);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 20px 60px rgba(0,0,0,0.42);
      padding: 28px 22px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(251,191,36,0.12);
      color: var(--accent);
      font-size: 11px;
      border: 1px solid rgba(251,191,36,0.3);
      margin-bottom: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 10px; font-size: clamp(1.6rem, 2.5vw, 2.4rem); }
    p { margin: 0 0 14px; color: var(--muted); line-height: 1.7; font-size: 14px; }
    a { display: inline-block; margin-top: 8px; color: var(--accent); text-decoration: none; font-weight: 700; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Bamanankan</div>
    <h1>Bamanankan AI Studio</h1>
    <p>Aw bɛ ka appu ka bɔ. A bɛna ka wuli ni jɛya la.</p>
    <p>Aw bɛ se ka kɛ ni jatew, kalan, kamera, ani ja dilan.</p>
    <p><a href="./bambara_ai_studio_fixed.html">Kuma ka kɛ taabolo</a></p>
  </div>
</body>
</html>
